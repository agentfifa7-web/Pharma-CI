name: Synchronisation des pharmacies

# Récupère chaque jour les données publiques de https://www.pharmacies-de-garde.ci
# (pharmacies de garde, annuaire, médicaments + prix, liste CMU, actualités) → public/data/*.json
on:
  schedule:
    - cron: '17 6 * * *' # tous les jours à 06:17 (heure d'Abidjan = UTC)
  workflow_dispatch:
    inputs:
      garde_only:
        description: 'Garde + médicaments uniquement (rapide, sans annuaire ni actualités)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-pharmacies
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests des parseurs
        run: npm run sync:test
      - name: Synchronisation
        run: node scripts/sync-pharmacies/sync.mjs ${{ inputs.garde_only && '--garde-only' || '' }}
      - name: Publication des données
        run: |
          if [ -z "$(git status --porcelain -- public/data scripts/sync-pharmacies)" ]; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "pharma-ci-bot"
          git config user.email "pharma-ci-bot@users.noreply.github.com"
          git add public/data scripts/sync-pharmacies
          git commit -m "Données : synchronisation pharmacies-de-garde.ci ($(date -u +%F))"
          # main a pu avancer pendant la synchronisation (longue) : on se replace dessus avant de publier.
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 10))
          done
          exit 1
      - name: Sauvegarde des données (téléchargeable depuis le résumé du lancement)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: donnees-pharmacies
          path: |
            public/data
            scripts/sync-pharmacies/cache
          if-no-files-found: ignore
          retention-days: 7
