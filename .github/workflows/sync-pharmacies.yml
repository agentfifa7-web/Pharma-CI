name: Synchronisation des pharmacies

# Récupère chaque jour la liste des pharmacies de garde et l'annuaire publiés sur
# https://www.pharmacies-de-garde.ci, puis met à jour public/data/pharmacies.json.
on:
  schedule:
    - cron: '17 6 * * *' # tous les jours à 06:17 (heure d'Abidjan = UTC)
  workflow_dispatch:
    inputs:
      garde_only:
        description: 'Uniquement la liste de garde (plus rapide)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-pharmacies
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests des parseurs
        run: npm run sync:test
      - name: Synchronisation
        run: node scripts/sync-pharmacies/sync.mjs ${{ inputs.garde_only && '--garde-only' || '' }}
      - name: Publication des données
        run: |
          if git diff --quiet -- public/data scripts/sync-pharmacies/cache; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "pharma-ci-bot"
          git config user.email "pharma-ci-bot@users.noreply.github.com"
          git add public/data scripts/sync-pharmacies/cache
          git commit -m "Données : synchronisation pharmacies-de-garde.ci ($(date -u +%F))"
          git push
