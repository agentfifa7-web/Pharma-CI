name: Publication de l'application (GitHub Pages)

# Construit l'application et la publie sur GitHub Pages (nom de domaine de public/CNAME, sinon https://<compte>.github.io/<dépôt>/)
# — à chaque push sur main, après chaque synchronisation des données, ou à la demande.
# Prérequis (une fois) : Settings → Pages → Source : « GitHub Actions ».
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Synchronisation des pharmacies']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Avec un nom de domaine personnalisé (fichier public/CNAME), le site est servi à la racine « / » ;
      # sinon à l'adresse https://<compte>.github.io/<dépôt>/.
      - name: Build
        env:
          # Adresse du service de lecture des ordonnances par IA (services/ordonnance-ia), si configurée
          # dans Settings → Secrets and variables → Actions → Variables.
          VITE_ORDONNANCE_IA_URL: ${{ vars.ORDONNANCE_IA_URL }}
        run: |
          if [ -s public/CNAME ]; then BASE=/; else BASE=/${{ github.event.repository.name }}/; fi
          npx tsc -b && npx vite build --base="$BASE"
      - name: Routage SPA (liens directs)
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
