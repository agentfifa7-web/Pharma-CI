name: Génération initiale des données officielles (temporaire, 2)

on:
  push:
    branches: [claude/project-thread-cl34ak]
    paths: [.github/workflows/probe-sources.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:test
      - run: node scripts/sync-pharmacies/official.mjs
      - run: |
          git config user.name "pharma-ci-bot"
          git config user.email "pharma-ci-bot@users.noreply.github.com"
          git add public/data
          git commit -m "Données : sources officielles et libres (AIRP, OpenStreetMap, OMS, AIP, Ordre)" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
